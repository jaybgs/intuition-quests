<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <title>TrustQuests</title>
  <meta name="theme-color" content="#012E38" />
  <style>
    html,
    body {
      background-color: #012E38;
      /* Match gradient start */
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
    }

    /* Critical CSS for immediate gradient rendering */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: linear-gradient(180deg, #012E38 0%, #000000 50%, rgb(54, 5, 5) 100%);
      will-change: transform;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
